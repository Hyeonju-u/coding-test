<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코테 연습장 — 힌트 먼저, 답은 나중에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0da;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#b5651d; --warn-soft:#fbeee2;
  --bad:#b3261e; --bad-soft:#fbe9e7; --good:#2f6f5e; --good-soft:#e3efe9;
  --ed-bg:#1e1f22; --ed-ink:#e6e6e6; --ed-gutter:#6c6f75;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
code{font-family:var(--mono);font-size:.9em;background:#efece6;padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 14px}
button:hover{border-color:#c9c4bb}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}

.app{display:grid;grid-template-columns:250px minmax(320px,1fr) minmax(420px,1.25fr);height:100vh}
/* sidebar */
.side{border-right:1px solid var(--line);background:#faf9f6;display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 10px}
.brand h1{font-size:17px;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:6px;padding:6px 14px 10px}
.tabs button{flex:1;padding:6px 0;font-size:13.5px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plist{list-style:none;margin:0;padding:0 8px 16px;overflow:auto;flex:1}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.plist li:hover{background:#efece6}
.plist li.on{background:var(--accent-soft)}
.plist .st{width:20px;text-align:center;font-size:13px;flex:none}
.plist .lv{margin-left:auto;font-size:11.5px;color:var(--muted);flex:none}
.legend{padding:10px 18px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* problem column */
.prob{overflow:auto;padding:22px 26px 40px;min-height:0}
.prob .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:#efece6;font-size:12px}
.prob h2{margin:4px 0 12px;font-size:22px}
.desc{margin-bottom:22px}
.block{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.block h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.hint{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 8px 8px 0;margin:8px 0;font-size:14px}
.hint b{color:var(--warn)}
.hint-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.small{font-size:12.5px;color:var(--muted)}
.answer pre{background:var(--ed-bg);color:var(--ed-ink);padding:14px;border-radius:8px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.55;margin:8px 0 12px}
.answer ul{margin:0;padding-left:18px}
.answer li{margin:4px 0;font-size:14px}
.examples table{border-collapse:collapse;width:100%;font-size:13px}
.examples td,.examples th{border:1px solid var(--line);padding:5px 8px;text-align:left;font-family:var(--mono);vertical-align:top;white-space:pre-wrap}
.examples th{font-family:inherit;background:#faf9f6;font-weight:500}

/* editor column */
.work{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar .sp{flex:1}
.engine{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.ok{background:#3aa66b}.dot.load{background:#e0a030}.dot.err{background:var(--bad)}
.editor{flex:1 1 55%;display:flex;min-height:180px;background:var(--ed-bg);overflow:hidden;position:relative}
.gutter{width:44px;flex:none;padding:12px 8px 12px 0;text-align:right;color:var(--ed-gutter);font-family:var(--mono);font-size:13.5px;line-height:21px;overflow:hidden;user-select:none;white-space:pre}
textarea.code{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ed-ink);font-family:var(--mono);font-size:13.5px;line-height:21px;padding:12px 14px 12px 10px;tab-size:4;white-space:pre;overflow:auto;caret-color:#fff}
.runbar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #2c2d31;background:#26272b;align-items:center;flex-wrap:wrap}
.runbar label{color:#aaa;font-size:12px}
.runbar input,.runbar textarea{font-family:var(--mono);font-size:12.5px;background:#1b1c1f;color:#ddd;border:1px solid #3a3b40;border-radius:6px;padding:5px 8px}
.runbar textarea{resize:vertical;height:30px;min-height:30px;flex:1}
.runbar input{flex:1;min-width:120px}
.runbar button{background:#34363b;color:#eee;border-color:#45474d}
.runbar button.primary{background:var(--accent);border-color:var(--accent)}
.out{flex:1 1 45%;overflow:auto;padding:14px 16px;min-height:120px;font-size:14px}
.out .empty{color:var(--muted);font-size:13.5px}
.res-head{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.res-head.good{color:var(--good)}.res-head.bad{color:var(--bad)}
.case{border:1px solid var(--line);border-radius:8px;margin:6px 0;overflow:hidden}
.case summary{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13.5px;list-style:none}
.case summary::-webkit-details-marker{display:none}
.case.pass summary{background:var(--good-soft)}
.case.fail summary{background:var(--bad-soft)}
.case .body{padding:8px 12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all}
.case .body div{margin:2px 0}
.case .k{color:var(--muted);font-family:'Noto Sans KR',sans-serif;display:inline-block;min-width:68px}
pre.stdout{background:#f6f5f2;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:6px 0}
.errbox{background:var(--bad-soft);border:1px solid #f0c9c4;border-radius:8px;padding:10px 12px;font-size:13.5px;margin:6px 0}
.errbox .t{font-weight:700;color:var(--bad)}
.errbox .m{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin-top:4px}
.errbox .tip{margin-top:6px;color:#5a3a37;font-size:13px;font-family:'Noto Sans KR',sans-serif;white-space:normal}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.38);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border-radius:14px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 8px}
.modal p{margin:6px 0;font-size:14px;color:#3a3a3d}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media (max-width:1100px){
  .app{grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  .work{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);min-height:80vh}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .plist{max-height:220px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>코테 연습장</h1>
      <p>직접 짜고 → 힌트 → 그래도 막히면 답</p>
    </div>
    <div class="tabs">
      <button data-lang="python" class="on">Python</button>
      <button data-lang="c">C</button>
    </div>
    <ul class="plist" id="plist"></ul>
    <div class="legend">✅ 통과 · ✏️ 푸는 중 · 👀 답 봄<br>코드는 이 브라우저에 자동 저장돼요.</div>
  </aside>

  <main class="prob" id="prob"></main>

  <section class="work">
    <div class="toolbar">
      <span class="engine"><span class="dot" id="engDot"></span><span id="engTxt">엔진 대기</span></span>
      <span class="sp"></span>
      <button class="ghost" id="btnReset" title="처음 코드로 되돌리기">초기화</button>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter">1</div>
      <textarea class="code" id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="runbar">
      <label id="customLabel">직접 호출</label>
      <input id="customPy" placeholder="예: find_max([1, 2, 3])">
      <textarea id="customC" placeholder="표준입력" style="display:none"></textarea>
      <button id="btnRun">실행</button>
      <button class="primary" id="btnSubmit">채점 <span class="small" style="color:#cfe">⌘/Ctrl+Enter</span></button>
    </div>
    <div class="out" id="out"><div class="empty">코드를 작성하고 <b>채점</b>을 눌러보세요. <b>실행</b>은 위 칸에 적은 호출/입력만 돌려봐요.</div></div>
  </section>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>정말 답을 볼까요?</h3>
    <p id="modalMsg"></p>
    <p class="small">답을 본 뒤에는 에디터를 비우고 <b>안 보고 다시 쳐보는 것</b>까지 해야 내 것이 돼요.</p>
    <div class="row">
      <button id="modalNo">조금 더 해볼게</button>
      <button class="primary" id="modalYes">답 보기</button>
    </div>
  </div>
</div>

<script src="problems.js"></script>
<script>
(function(){
const PROBLEMS = window.PROBLEMS;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------------- 저장 ----------------
const KEY = 'cote-practice:v1';
let store = { code:{}, st:{}, lang:'python', cur:null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) store = Object.assign(store, s); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
function st(id){ return store.st[id] || (store.st[id] = { hints:0, solved:false, seen:false, tried:false }); }

let cur = null;

// ---------------- 목록 ----------------
function renderList(){
  const ul = $('plist'); ul.innerHTML = '';
  PROBLEMS.filter(p => p.lang === store.lang).forEach((p, i) => {
    const s = st(p.id);
    const icon = s.solved ? (s.seen ? '✅' : '✅') : s.seen ? '👀' : (s.tried || store.code[p.id]) ? '✏️' : '·';
    const li = document.createElement('li');
    if (cur && cur.id === p.id) li.className = 'on';
    li.innerHTML = `<span class="st">${icon}</span><span>${i+1}. ${esc(p.title)}</span><span class="lv">${'★'.repeat(p.level)}</span>`;
    li.onclick = () => open(p.id);
    ul.appendChild(li);
  });
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.lang === store.lang));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  store.lang = b.dataset.lang; save();
  const first = PROBLEMS.find(p => p.lang === store.lang);
  const last = PROBLEMS.find(p => p.id === store['last_' + store.lang]);
  open((last || first).id);
});

// ---------------- 문제 화면 ----------------
function open(id){
  const p = PROBLEMS.find(x => x.id === id); if (!p) return;
  cur = p; store.cur = id; store.lang = p.lang; store['last_' + p.lang] = id; save();
  const code = store.code[id] != null ? store.code[id] : p.starter;
  $('code').value = code; syncGutter();
  $('customPy').style.display = p.lang === 'python' ? '' : 'none';
  $('customC').style.display = p.lang === 'c' ? '' : 'none';
  $('customLabel').textContent = p.lang === 'python' ? '직접 호출' : '표준입력';
  $('customPy').value = p.lang === 'python' ? p.tests[0].call : '';
  $('customC').value = p.lang === 'c' ? p.tests[0].input : '';
  $('out').innerHTML = '<div class="empty">코드를 작성하고 <b>채점</b>을 눌러보세요. <b>실행</b>은 아래 칸에 적은 ' + (p.lang==='python'?'호출식':'입력') + '으로 한 번만 돌려봐요.</div>';
  renderProblem(); renderList();
  if (p.lang === 'python') py.ensure(); else cEngine.ensure();
  updateEngine();
}

function renderProblem(){
  const p = cur, s = st(p.id);
  const ex = p.tests.slice(0, 2);
  const exRows = p.lang === 'python'
    ? ex.map(t => `<tr><td>${esc(t.call)}</td><td>${esc(t.expected)}</td></tr>`).join('')
    : ex.map(t => `<tr><td>${esc(t.input)}</td><td>${esc(t.output)}</td></tr>`).join('');
  const hintHtml = p.hints.slice(0, s.hints).map((h, i) => `<div class="hint"><b>힌트 ${i+1}</b> · ${esc(h)}</div>`).join('');
  const remain = p.hints.length - s.hints;
  $('prob').innerHTML = `
    <div class="meta"><span class="pill">${p.lang === 'python' ? 'Python' : 'C'}</span><span>난이도 ${'★'.repeat(p.level)}</span>${s.solved ? '<span class="pill" style="background:var(--good-soft);color:var(--good)">통과</span>' : ''}</div>
    <h2>${esc(p.title)}</h2>
    <div class="desc">${p.desc}</div>
    <div class="block examples">
      <h3>예시</h3>
      <table><tr><th>${p.lang === 'python' ? '호출' : '입력'}</th><th>${p.lang === 'python' ? '반환값' : '출력'}</th></tr>${exRows}</table>
      <div class="small" style="margin-top:6px">채점은 숨은 경우(빈 입력, 끝값 등)까지 총 ${p.tests.length}개로 해요.</div>
    </div>
    <div class="block">
      <h3>💡 힌트 <span class="small">${s.hints}/${p.hints.length}</span></h3>
      ${hintHtml || '<div class="small">막혔을 때 하나씩 열어보세요. 한 번에 하나만!</div>'}
      <div class="hint-actions">
        <button id="btnHint" ${remain ? '' : 'disabled'}>${remain ? `힌트 ${s.hints + 1} 열기` : '힌트를 다 열었어요'}</button>
        <span class="sp" style="flex:1"></span>
        <button id="btnAnswer" class="ghost">${s.seen ? '답 다시 보기' : '답 보기'}</button>
      </div>
    </div>
    <div id="answerBox"></div>`;
  $('btnHint').onclick = () => { s.hints = Math.min(p.hints.length, s.hints + 1); save(); renderProblem(); };
  $('btnAnswer').onclick = () => s.seen ? showAnswer() : askAnswer();
}

function askAnswer(){
  const s = st(cur.id), left = cur.hints.length - s.hints;
  $('modalMsg').innerHTML = left > 0
    ? `아직 안 본 힌트가 <b>${left}개</b> 남았어요. 다음 힌트 하나만 더 보고 5분만 더 해보는 건 어때요?`
    : (s.tried ? '힌트를 다 봤고 시도도 해봤네요. 지금 답을 보는 것도 좋은 선택이에요.' : '힌트는 다 봤지만 아직 채점을 한 번도 안 돌려봤어요. 틀려도 되니 한 번 제출해 보는 건 어때요?');
  $('modal').classList.add('on');
}
$('modalNo').onclick = () => $('modal').classList.remove('on');
$('modalYes').onclick = () => { $('modal').classList.remove('on'); st(cur.id).seen = true; save(); renderProblem(); showAnswer(); renderList(); };
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('on'); };

function showAnswer(){
  const p = cur;
  $('answerBox').innerHTML = `<div class="block answer">
    <h3>📖 정답 & 해설</h3>
    <pre>${esc(p.answer)}</pre>
    <ul>${p.explain.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <div class="hint-actions"><button id="btnHide">답 숨기기</button><span class="small">숨기고 처음부터 다시 쳐보세요 → <b>초기화</b> 버튼</span></div>
  </div>`;
  $('btnHide').onclick = () => { $('answerBox').innerHTML = ''; };
  $('answerBox').scrollIntoView({ behavior:'smooth', block:'start' });
}

// ---------------- 에디터 ----------------
const ta = $('code');
function syncGutter(){
  const n = ta.value.split('\n').length;
  let s = ''; for (let i = 1; i <= n; i++) s += i + '\n';
  $('gutter').textContent = s;
  $('gutter').scrollTop = ta.scrollTop;
}
ta.addEventListener('scroll', () => { $('gutter').scrollTop = ta.scrollTop; });
let saveT;
ta.addEventListener('input', () => {
  syncGutter();
  clearTimeout(saveT);
  saveT = setTimeout(() => { if (cur) { store.code[cur.id] = ta.value; save(); } }, 300);
});
function replaceSel(text, selStart, selEnd){
  ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
  if (selStart != null) { ta.selectionStart = selStart; ta.selectionEnd = selEnd; }
  ta.dispatchEvent(new Event('input'));
}
ta.addEventListener('keydown', e => {
  const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    if (e.shiftKey) {
      const line = v.slice(ls);
      const m = line.match(/^ {1,4}/);
      if (m) { ta.setRangeText('', ls, ls + m[0].length, 'preserve'); ta.selectionStart = ta.selectionEnd = Math.max(ls, a - m[0].length); ta.dispatchEvent(new Event('input')); }
    } else if (a !== b && v.slice(a, b).includes('\n')) {
      const block = v.slice(ls, b).replace(/^/gm, '    ');
      ta.setRangeText(block, ls, b, 'select'); ta.dispatchEvent(new Event('input'));
    } else replaceSel('    ');
    return;
  }
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const line = v.slice(ls, a);
    let indent = line.match(/^\s*/)[0];
    const t = line.trimEnd();
    const opener = cur && cur.lang === 'python' ? /:$/.test(t) : /[{(]$/.test(t);
    if (opener) indent += '    ';
    // C: Enter between { } -> close brace on its own line
    if (cur && cur.lang === 'c' && /\{$/.test(t) && v[b] === '}') {
      const base = line.match(/^\s*/)[0];
      const ins = '\n' + indent + '\n' + base;
      ta.setRangeText(ins, a, b, 'start');
      ta.selectionStart = ta.selectionEnd = a + 1 + indent.length;
      ta.dispatchEvent(new Event('input')); return;
    }
    replaceSel('\n' + indent);
    return;
  }
  if (e.key === '}' && cur && cur.lang === 'c') {
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const before = v.slice(ls, a);
    if (/^\s+$/.test(before) && a === b) {
      e.preventDefault();
      const ni = before.replace(/ {1,4}$/, '');
      ta.setRangeText(ni + '}', ls, a, 'end'); ta.dispatchEvent(new Event('input'));
    }
  }
});
$('btnReset').onclick = () => {
  if (!cur) return;
  if (ta.value !== cur.starter && !$('btnReset').dataset.armed) {
    $('btnReset').dataset.armed = '1'; $('btnReset').textContent = '한 번 더 누르면 초기화';
    setTimeout(() => { delete $('btnReset').dataset.armed; $('btnReset').textContent = '초기화'; }, 2500);
    return;
  }
  delete $('btnReset').dataset.armed; $('btnReset').textContent = '초기화';
  ta.value = cur.starter; store.code[cur.id] = cur.starter; save(); syncGutter();
};

// ---------------- 엔진: Python (Pyodide, Web Worker) ----------------
const PY_WORKER = `
let py = null, loadErr = null;
const ready = (async () => {
  try {
    importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');
    py = await loadPyodide();
    py.runPython(${JSON.stringify(`
import sys, io, json, traceback
def __fmt(e, code):
    lines = code.splitlines()
    if isinstance(e, SyntaxError) and e.filename == "solution.py":
        return {"type": type(e).__name__, "msg": str(e.msg), "line": e.lineno, "src": (e.text or "").rstrip()}
    frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == "solution.py"]
    f = frames[-1] if frames else None
    ln = f.lineno if f else None
    src = lines[ln - 1] if ln and 0 < ln <= len(lines) else ""
    return {"type": type(e).__name__, "msg": str(e), "line": ln, "src": src}
def __run(code, call, expected):
    out = io.StringIO(); old = sys.stdout; sys.stdout = out
    r = {"ok": False}
    try:
        ns = {"__name__": "__main__"}
        exec(compile(code, "solution.py", "exec"), ns)
        if call:
            got = eval(call, ns)
            r["got"] = repr(got)
            if expected is not None:
                exp = eval(expected)
                r["expected"] = repr(exp)
                r["ok"] = bool(got == exp) and type(got) is type(exp)
            else:
                r["ok"] = True
        else:
            r["ok"] = True
    except BaseException as e:
        r["error"] = __fmt(e, code)
    finally:
        sys.stdout = old
    r["stdout"] = out.getvalue()[:5000]
    return json.dumps(r)
`)});
    postMessage({ type: 'ready' });
  } catch (e) { loadErr = String(e); postMessage({ type: 'loaderr', msg: loadErr }); }
})();
onmessage = async (e) => {
  await ready;
  if (!py) { postMessage({ type: 'result', id: e.data.id, result: { ok:false, error:{ type:'EngineError', msg: loadErr || '파이썬 엔진을 불러오지 못했어요' } } }); return; }
  const { id, code, call, expected } = e.data;
  const f = py.globals.get('__run');
  const res = f(code, call || '', expected == null ? null : expected);
  f.destroy();
  postMessage({ type: 'result', id, result: JSON.parse(res) });
};`;

const py = {
  w: null, state: 'idle', seq: 0, pending: null,
  ensure(){
    if (this.w) return;
    this.state = 'loading'; updateEngine();
    try {
      this.w = new Worker(URL.createObjectURL(new Blob([PY_WORKER], { type: 'text/javascript' })));
    } catch (e) { this.state = 'error'; this.msg = String(e); updateEngine(); return; }
    this.w.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'ready') { this.state = 'ready'; updateEngine(); }
      else if (d.type === 'loaderr') { this.state = 'error'; this.msg = d.msg; updateEngine(); }
      else if (d.type === 'result' && this.pending && this.pending.id === d.id) { const p = this.pending; this.pending = null; clearTimeout(p.timer); p.resolve(d.result); }
    };
    this.w.onerror = (e) => { this.state = 'error'; this.msg = e.message; updateEngine(); };
  },
  kill(){ if (this.w) this.w.terminate(); this.w = null; this.state = 'idle'; this.ensure(); },
  run(code, call, expected, ms){
    this.ensure();
    return new Promise(resolve => {
      const id = ++this.seq;
      // 엔진 로딩 시간은 제한시간에서 제외: ready가 된 다음부터 타이머 시작
      const start = () => {
        const timer = setTimeout(() => {
          this.pending = null; this.kill();
          resolve({ ok:false, timeout:true });
        }, ms);
        this.pending = { id, resolve, timer };
        this.w.postMessage({ id, code, call, expected });
      };
      const wait = () => { if (this.state === 'ready') start(); else if (this.state === 'error') resolve({ ok:false, error:{ type:'EngineError', msg:'파이썬 엔진을 불러오지 못했어요: ' + (this.msg || '') } }); else setTimeout(wait, 150); };
      wait();
    });
  }
};

// ---------------- 엔진: C (JSCPP 인터프리터, Web Worker) ----------------
const C_WORKER_TAIL = `
onmessage = (e) => {
  const { id, code, input } = e.data;
  let out = '';
  try {
    const exit = JSCPP.run(code, input, { stdio: { write: s => { out += s; if (out.length > 20000) throw new Error('출력이 너무 많아요 (무한 루프?)'); } }, maxTimeout: 2500 });
    postMessage({ id, ok: true, out, exit });
  } catch (err) {
    postMessage({ id, ok: false, out, err: String(err && err.message || err) });
  }
};
postMessage({ type: 'ready' });`;
const cEngine = {
  w: null, state: 'idle', seq: 0, pending: null,
  ensure(){
    if (this.w) return;
    this.state = 'loading'; updateEngine();
    const src = 'var window = self;\nimportScripts(' + JSON.stringify(new URL('jscpp.min.js', location.href).href) + ');\nvar JSCPP = self.JSCPP;\n' + C_WORKER_TAIL;
    try { this.w = new Worker(URL.createObjectURL(new Blob([src], { type:'text/javascript' }))); }
    catch (e) { this.state = 'error'; this.msg = String(e); updateEngine(); return; }
    this.w.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'ready') { this.state = 'ready'; updateEngine(); return; }
      if (this.pending && this.pending.id === d.id) { const p = this.pending; this.pending = null; clearTimeout(p.timer); p.resolve(d); }
    };
    this.w.onerror = (e) => { this.state = 'error'; this.msg = e.message; updateEngine(); };
  },
  kill(){ if (this.w) this.w.terminate(); this.w = null; this.state = 'idle'; this.ensure(); },
  run(code, input, ms){
    this.ensure();
    return new Promise(resolve => {
      const id = ++this.seq;
      const start = () => {
        const timer = setTimeout(() => { this.pending = null; this.kill(); resolve({ ok:false, timeout:true, out:'' }); }, ms);
        this.pending = { id, resolve, timer };
        this.w.postMessage({ id, code, input });
      };
      const wait = () => { if (this.state === 'ready') start(); else if (this.state === 'error') resolve({ ok:false, err:'C 실행기를 불러오지 못했어요: ' + (this.msg||''), out:'' }); else setTimeout(wait, 100); };
      wait();
    });
  }
};

function updateEngine(){
  const e = cur && cur.lang === 'c' ? cEngine : py;
  const name = cur && cur.lang === 'c' ? 'C 실행기' : '파이썬';
  const dot = $('engDot'), txt = $('engTxt');
  dot.className = 'dot ' + (e.state === 'ready' ? 'ok' : e.state === 'error' ? 'err' : 'load');
  txt.textContent = e.state === 'ready' ? name + ' 준비됨'
    : e.state === 'error' ? name + ' 로딩 실패'
    : name + (cur && cur.lang === 'python' ? ' 불러오는 중… (처음 한 번 5~15초)' : ' 불러오는 중…');
}

// ---------------- 실행 / 채점 ----------------
let busy = false;
function setBusy(b){ busy = b; $('btnRun').disabled = b; $('btnSubmit').disabled = b; }

function normOut(s){ return String(s).replace(/\r/g,'').split('\n').map(l => l.replace(/\s+$/,'')).join('\n').trim(); }

const PY_TIPS = {
  NameError: '변수나 함수 이름 오타, 또는 정의하기 전에 사용했는지 확인해 보세요.',
  IndentationError: '들여쓰기가 맞지 않아요. 같은 블록은 같은 칸 수(보통 4칸)로 맞춰야 해요.',
  SyntaxError: '문법 오류예요. 콜론(:) 빠짐, 괄호 짝, 따옴표 짝을 먼저 확인해 보세요.',
  IndexError: '리스트 범위를 벗어난 인덱스를 썼어요. 마지막 인덱스는 len - 1 이에요. 빈 리스트일 때도 생각해 보세요.',
  KeyError: '딕셔너리에 없는 key를 꺼내려 했어요. in 으로 먼저 확인하거나 .get()을 써보세요.',
  TypeError: '자료형이 안 맞아요. 예: 문자열 + 숫자, None에 연산, 함수 인자 개수 틀림.',
  ZeroDivisionError: '0으로 나눴어요.',
  RecursionError: '재귀가 너무 깊어요. 멈추는 조건(base case)이 있는지, 문제를 매번 작게 만들고 있는지 확인해 보세요.',
  UnboundLocalError: '함수 안에서 값을 대입하기 전에 그 변수를 읽었어요.',
  AttributeError: '그 자료형에는 없는 메서드/속성을 썼어요. 예: 리스트에 .add() (집합 메서드)',
};
function errHtml(err){
  const tip = PY_TIPS[err.type] ? `<div class="tip">💡 ${esc(PY_TIPS[err.type])}</div>` : '';
  const where = err.line ? `<div class="m">${err.line}번째 줄${err.src ? ': ' + esc(err.src.trim()) : ''}</div>` : '';
  return `<div class="errbox"><div class="t">${esc(err.type)}</div><div class="m">${esc(err.msg)}</div>${where}${tip}</div>`;
}
function cErrHtml(msg){
  let tip = '';
  if (/Parsing Failure/i.test(msg)) tip = '문법 오류예요. 세미콜론(;) 빠짐, 중괄호 { } 짝, 괄호 짝을 확인해 보세요. 화살표(^)가 가리키는 바로 앞을 보세요.';
  else if (/Time limit/i.test(msg)) tip = '시간 초과예요. 반복문의 조건이 언젠가 거짓이 되는지(i++ 빠짐?) 확인해 보세요.';
  else if (/index out of bound|negative index/i.test(msg)) tip = '배열 범위를 벗어났어요. 마지막 인덱스는 n - 1 이에요.';
  else if (/not defined|does not exist/i.test(msg)) tip = '선언 안 된 이름이에요. 오타나 선언 위치를 확인해 보세요. (이 실행기는 struct, malloc을 지원하지 않아요)';
  else if (/Memory overflow/i.test(msg)) tip = '두 가지 경우가 많아요: ① 입력이 끝났는데 scanf를 더 부름 (반복문이 생각보다 많이 돎) ② 이 브라우저 C 실행기의 한계 — 배열 칸에 바로 scanf(&arr[i])는 안 되니 변수로 받은 뒤 arr[i] = x; 로 넣어주세요.';
  return `<div class="errbox"><div class="t">실행 오류</div><div class="m">${esc(msg)}</div>${tip ? `<div class="tip">💡 ${esc(tip)}</div>` : ''}</div>`;
}

async function runOnce(){
  if (busy || !cur) return;
  setBusy(true);
  const code = ta.value;
  $('out').innerHTML = '<div class="empty">실행 중…</div>';
  if (cur.lang === 'python') {
    const call = $('customPy').value.trim();
    const r = await py.run(code, call, null, 5000);
    let h = `<div class="res-head">실행 결과</div>`;
    if (r.timeout) h += cErrHtml('Time limit exceeded (5초)').replace('실행 오류','시간 초과').replace('시간 초과예요. 반복문의 조건이','5초 안에 안 끝났어요. 무한 루프이거나 너무 느린 방법일 수 있어요. 반복문의 조건이');
    else {
      if (r.stdout) h += `<div class="small">print 출력</div><pre class="stdout">${esc(r.stdout)}</pre>`;
      if (r.error) h += errHtml(r.error);
      else if (call) h += `<div class="small">반환값</div><pre class="stdout">${esc(r.got)}</pre>`;
      else if (!r.stdout) h += '<div class="empty">출력이 없어요. 위 칸에 함수 호출식을 적으면 반환값을 볼 수 있어요.</div>';
    }
    $('out').innerHTML = h;
  } else {
    const r = await cEngine.run(code, $('customC').value, 5000);
    let h = `<div class="res-head">실행 결과</div>`;
    h += `<div class="small">출력</div><pre class="stdout">${esc(r.out || '') || '(출력 없음)'}</pre>`;
    if (r.timeout) h += cErrHtml('Time limit exceeded');
    else if (!r.ok) h += cErrHtml(r.err);
    $('out').innerHTML = h;
  }
  setBusy(false);
}

async function submit(){
  if (busy || !cur) return;
  setBusy(true);
  const p = cur, code = ta.value, s = st(p.id);
  store.code[p.id] = code; s.tried = true; save();
  const results = [];
  $('out').innerHTML = '<div class="empty">채점 중… (0/' + p.tests.length + ')</div>';
  let stop = false, fatal = null;
  for (let i = 0; i < p.tests.length; i++) {
    const t = p.tests[i];
    if (stop) { results.push({ skip:true, t }); continue; }
    let r;
    if (p.lang === 'python') {
      r = await py.run(code, t.call, t.expected, 4000);
      r.t = t;
      if (r.error && (r.error.type === 'SyntaxError' || r.error.type === 'IndentationError' || r.error.type === 'EngineError')) { fatal = r; results.push(r); stop = 'fatal'; continue; }
      if (r.timeout) stop = 'timeout';
    } else {
      const c = await cEngine.run(code, t.input, 4000);
      r = { t, got: c.out || '', ok: c.ok && normOut(c.out) === normOut(t.output), err: c.ok ? null : (c.timeout ? 'Time limit exceeded' : c.err), timeout: c.timeout };
      if (!c.ok && /Parsing Failure|C 실행기/.test(c.err || '')) { fatal = r; results.push(r); stop = 'fatal'; continue; }
      if (r.timeout) stop = 'timeout';
    }
    results.push(r);
    $('out').querySelector('.empty') && ($('out').querySelector('.empty').textContent = `채점 중… (${i+1}/${p.tests.length})`);
  }
  const passed = results.filter(r => r.ok).length;
  const all = passed === p.tests.length;
  if (all && !s.solved) { s.solved = true; save(); renderProblem(); }
  renderList();

  let h = `<div class="res-head ${all ? 'good' : 'bad'}">${all ? '🎉 모두 통과!' : '아직이에요'} <span class="small">${passed}/${p.tests.length} 통과</span></div>`;
  if (all) h += `<div class="small" style="margin-bottom:8px">${s.seen ? '답을 본 문제예요. 내일 한 번 더 안 보고 풀어보면 진짜 내 것이 돼요.' : '답 안 보고 풀었어요. 해설에서 시간복잡도도 한 번 확인해 보세요.'}</div>`;
  if (stop === 'fatal') {
    const r = fatal;
    h += p.lang === 'python' ? errHtml(r.error) : cErrHtml(r.err);
    h += `<div class="small">코드가 실행되기 전에 멈췄어요. 이 오류부터 고쳐 보세요.</div>`;
  } else {
    let firstFail = true;
    results.forEach((r, i) => {
      if (r.skip) { h += `<details class="case"><summary>· 케이스 ${i+1} — 건너뜀 (앞에서 시간 초과)</summary></details>`; return; }
      const cls = r.ok ? 'pass' : 'fail';
      const open = !r.ok && firstFail ? ' open' : ''; if (!r.ok) firstFail = false;
      let body = '';
      if (p.lang === 'python') {
        body += `<div><span class="k">호출</span>${esc(r.t.call)}</div><div><span class="k">기대값</span>${esc(r.t.expected)}</div>`;
        if (r.timeout) body += `<div><span class="k">결과</span>⏱ 시간 초과 (4초). 무한 루프이거나 너무 느린 방법이에요.</div>`;
        else if (r.error) body += `<div><span class="k">결과</span></div>` + errHtml(r.error);
        else body += `<div><span class="k">내 결과</span>${esc(r.got)}</div>` + (r.got === 'None' ? `<div class="small" style="font-family:inherit">💡 None이 나왔다면 return을 빠뜨렸을 가능성이 커요.</div>` : '');
        if (r.stdout) body += `<div><span class="k">print</span>${esc(r.stdout.trim())}</div>`;
      } else {
        body += `<div><span class="k">입력</span>${esc(r.t.input)}</div><div><span class="k">기대 출력</span>${esc(r.t.output)}</div><div><span class="k">내 출력</span>${esc(r.got.trim()) || '(없음)'}</div>`;
        if (r.err) body += cErrHtml(r.err);
      }
      h += `<details class="case ${cls}"${open}><summary>${r.ok ? '✅' : '❌'} 케이스 ${i+1}${r.timeout ? ' — 시간 초과' : ''}</summary><div class="body">${body}</div></details>`;
    });
  }
  if (!all && s.hints < p.hints.length) h += `<div class="small" style="margin-top:10px">막혔다면 왼쪽에서 <b>힌트 ${s.hints + 1}</b>을 열어보세요.</div>`;
  $('out').innerHTML = h;
  setBusy(false);
}
$('btnRun').onclick = runOnce;
$('btnSubmit').onclick = submit;
$('customPy').addEventListener('keydown', e => { if (e.key === 'Enter') runOnce(); });

// ---------------- 시작 ----------------
const start = PROBLEMS.find(p => p.id === store.cur) || PROBLEMS.find(p => p.lang === store.lang) || PROBLEMS[0];
open(start.id);
})();
</script>
